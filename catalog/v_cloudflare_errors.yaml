name: v_cloudflare_errors
comment: Cloudflare Worker 5xx responses, non-ok/non-canceled outcomes, error logs (excluding 404 route misses), and uncaught exceptions
statement: |
  FROM scopedb.public.cloudflare_worker_events
  WHERE event_type = 'worker.exception'
     OR (
         event_type = 'worker.invocation'
         AND (attributes['exception_count']::int IS NULL OR attributes['exception_count']::int = 0)
         AND (
             (status IS NOT NULL AND status >= 500)
             OR (outcome != 'ok' AND outcome != 'canceled')
         )
     )
     OR (
         event_type = 'worker.log'
         AND level = 'error'
         AND (outcome != 'ok' OR status IS NULL OR status != 404)
     )
  SELECT
      occurred_at,
      service,
      event_type,
      outcome,
      level,
      method,
      host,
      path,
      status,
      ray_id,
      message,
      attributes['invocation_id']::string AS invocation_id,
      attributes['exception_name']::string AS exception_name,
      attributes['stack']::string AS stack,
      attributes['truncated']::boolean AS truncated,
      attributes

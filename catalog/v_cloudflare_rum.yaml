name: v_cloudflare_rum
comment: First-party browser RUM pageviews, Web Vitals, user actions, and client errors emitted via structured Tail Worker telemetry
statement: |
  FROM scopedb.public.cloudflare_worker_events
  WHERE starts_with(event_type, 'rum.')
  SELECT
      occurred_at,
      service,
      event_type,
      outcome,
      level,
      host,
      path,
      ray_id,
      message,
      attributes['environment']::string AS environment,
      attributes['app_version']::string AS app_version,
      attributes['invocation_id']::string AS invocation_id,
      attributes['trace_id']::string AS trace_id,
      attributes['session_id']::string AS session_id,
      attributes['view_id']::string AS view_id,
      attributes['user_id']::string AS user_id,
      attributes['workspace_id']::string AS workspace_id,
      attributes['user_status']::string AS user_status,
      attributes['action_name']::string AS action_name,
      attributes['vital_name']::string AS vital_name,
      attributes['vital_value']::float AS vital_value,
      attributes['vital_rating']::string AS vital_rating,
      attributes['duration_ms']::float AS duration_ms,
      attributes['error_type']::string AS error_type,
      attributes['stack']::string AS stack,
      attributes['referer_host']::string AS referer_host,
      attributes['referer_path']::string AS referer_path,
      if(attributes['utm_source'] IS NOT NULL, attributes['utm_source']::string, attributes['query']['utm_source'][0]::string) AS utm_source,
      if(attributes['utm_medium'] IS NOT NULL, attributes['utm_medium']::string, attributes['query']['utm_medium'][0]::string) AS utm_medium,
      if(attributes['utm_campaign'] IS NOT NULL, attributes['utm_campaign']::string, attributes['query']['utm_campaign'][0]::string) AS utm_campaign,
      if(attributes['utm_term'] IS NOT NULL, attributes['utm_term']::string, attributes['query']['utm_term'][0]::string) AS utm_term,
      if(attributes['utm_content'] IS NOT NULL, attributes['utm_content']::string, attributes['query']['utm_content'][0]::string) AS utm_content,
      if(attributes['ref'] IS NOT NULL, attributes['ref']::string, attributes['query']['ref'][0]::string) AS ref,
      attributes['country']::string AS country,
      attributes['region']::string AS region,
      attributes['city']::string AS city,
      attributes['continent']::string AS continent,
      attributes['colo']::string AS colo,
      attributes['timezone']::string AS timezone,
      attributes['asn']::int AS asn,
      attributes['as_organization']::string AS as_organization,
      attributes['user_agent']::string AS user_agent,
      attributes['truncated']::boolean AS truncated,
      attributes

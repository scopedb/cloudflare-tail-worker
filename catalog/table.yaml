name: cloudflare_worker_events
comment: Cloudflare Worker invocations, console logs, and uncaught exceptions
columns:
  - name: event_id
    data_type: string
    comment: Unique row identifier
  - name: occurred_at
    data_type: timestamp
    comment: Event timestamp in UTC
  - name: service
    data_type: string
    comment: Producer Worker name (scriptName)
  - name: event_type
    data_type: string
    comment: worker.invocation, worker.log, or worker.exception
  - name: outcome
    data_type: string
    comment: Worker execution outcome (ok, exception, exceededCpu, etc.)
  - name: level
    data_type: string
    comment: Normalized severity (debug, info, warn, error)
  - name: method
    data_type: string
    comment: HTTP request method when triggered by fetch
  - name: host
    data_type: string
    comment: Request URL hostname
  - name: path
    data_type: string
    comment: Request URL pathname without query parameters
  - name: status
    data_type: int
    comment: HTTP response status code
  - name: ray_id
    data_type: string
    comment: Cloudflare Ray ID (cf-ray)
  - name: message
    data_type: string
    comment: Human-readable event summary, log line, or exception message
  - name: attributes
    data_type: object
    comment: Structured invocation timings, edge metadata, log arguments, or stack trace
cluster_by:
  - service
  - occurred_at

name: v_cloudflare_ai_bots
comment: AI-identified requests and Markdown/llms.txt access, with separate identity and content signals
statement: |
  FROM scopedb.public.cloudflare_worker_events
  WHERE event_type = 'worker.invocation'
  SELECT
      occurred_at,
      service,
      outcome,
      method,
      host,
      path,
      status,
      ray_id,
      attributes['wall_time_ms']::float AS wall_time_ms,
      attributes['cpu_time_ms']::float AS cpu_time_ms,
      attributes['user_agent']::string AS user_agent,
      attributes['accept']::string AS accept,
      attributes['referer_host']::string AS referer_host,
      attributes['country']::string AS country,
      attributes['as_organization']::string AS as_organization,
      attributes['verified_bot_category']::string AS verified_bot_category
  SELECT *,
      if(verified_bot_category IN ('AI Crawler', 'AI Assistant', 'AI Search'), true, false) AS is_verified_ai_bot,
      if(regexp_like(
          user_agent,
          regex => '(?i)(ClaudeBot|Claude-Web|Claude-User|Anthropic|GPTBot|ChatGPT-User|OAI-SearchBot|Codex|Cursor|PerplexityBot|Perplexity-User|CCBot|Bytespider|Amazonbot|cohere-ai|YouBot)'
      ), true, false) AS is_ai_user_agent,
      if(path = '/llms.txt' OR ends_with(path, '.md') OR contains(accept, 'text/markdown'), true, false) AS is_markdown_request
  WHERE is_verified_ai_bot OR is_ai_user_agent OR is_markdown_request
